spring.application.name=stocksmart

# Import environment variables from .env if present
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Server Port
server.port=${SERVER_PORT:8080}

# Database Connection (externalized with environment variable fallbacks)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stocksmart?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.open-in-view=false

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:3000}
