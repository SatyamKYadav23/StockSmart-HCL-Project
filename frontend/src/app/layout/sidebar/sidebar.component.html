<aside
  class="sidebar"
  [class.sidebar-compact]="layoutService.isSidebarCompact()"
>
  <!-- Brand Header -->
  <div class="sidebar-header">
    <div class="brand-container">
      <div class="brand-logo">
        <app-icon name="inventory" [size]="16" [color]="'#ffffff'"></app-icon>
      </div>
      <div class="brand-text">
        <div class="brand-title-wrap">
          <span class="brand-title">StockSmart</span>
          <span class="brand-edition-pill">PRO</span>
        </div>
        <span class="brand-subtitle">Enterprise Inventory</span>
      </div>
    </div>

    <div class="header-controls">
      <!-- Collapse toggle on desktop -->
      <button
        type="button"
        class="compact-toggle-btn"
        (click)="layoutService.toggleSidebarCompact()"
        [title]="layoutService.isSidebarCompact() ? 'Expand sidebar' : 'Collapse sidebar'"
        aria-label="Toggle compact sidebar"
      >
        <app-icon [name]="layoutService.isSidebarCompact() ? 'chevron-right' : 'chevron-left'" [size]="15"></app-icon>
      </button>

      <!-- Mobile close button -->
      <button
        type="button"
        class="mobile-close-btn"
        (click)="layoutService.closeSidebarMobile()"
        aria-label="Close menu"
      >
        <app-icon name="x" [size]="18"></app-icon>
      </button>
    </div>
  </div>

  <!-- Navigation Links -->
  <nav class="sidebar-nav">
    <div *ngFor="let section of navSections" class="nav-section">
      <div *ngIf="section.title && !layoutService.isSidebarCompact()" class="nav-section-title">
        {{ section.title }}
      </div>
      <div *ngIf="layoutService.isSidebarCompact()" class="nav-section-divider"></div>

      <ul class="nav-list">
        <li *ngFor="let item of section.items" class="nav-item">
          <a
            [routerLink]="item.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
            (click)="onNavClick()"
            class="nav-link"
            [title]="layoutService.isSidebarCompact() ? item.label : ''"
          >
            <span class="nav-icon">
              <app-icon [name]="item.icon" [size]="16"></app-icon>
            </span>
            <span *ngIf="!layoutService.isSidebarCompact()" class="nav-label">{{ item.label }}</span>
            <span *ngIf="item.badge && !layoutService.isSidebarCompact()" class="nav-badge">{{ item.badge }}</span>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Sidebar Footer: Active Facility Context -->
  <div class="sidebar-footer">
    <div class="facility-card" [class.facility-compact]="layoutService.isSidebarCompact()" [title]="layoutService.isSidebarCompact() ? 'DC-01 Central Hub (Operational)' : ''">
      <div class="facility-beacon">
        <span class="beacon-ping"></span>
        <span class="beacon-core"></span>
      </div>
      <div *ngIf="!layoutService.isSidebarCompact()" class="facility-details">
        <span class="facility-name">DC-01 Central Hub</span>
        <span class="facility-status">Operational • Synced</span>
      </div>
    </div>
  </div>
</aside>
